name: ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: us_fundamentals

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: terroir
          POSTGRES_PASSWORD: terroir
          POSTGRES_DB: terroir_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U terroir"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TERROIR_PROFILE: test
      TERROIR_PG_TEST_DSN: postgresql://terroir:terroir@localhost:5432/terroir_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python -m us_fundamentals.jobs.minimal_pipeline

  pit-leakage:
    # UF-015 PIT metamorphic harness: a dedicated hard failure with a
    # required violation count of zero. Never made conditional.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
      - run: uv run pytest tests/test_pit_harness.py -q
